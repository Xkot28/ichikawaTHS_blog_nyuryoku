<!DOCTYPE html>
<html lang='ja'>
<head>
    <meta charset='UTF-8'>
    <title>EA3 投稿生成ツール</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #0056b3; }
        pre { background: #e9ecef; padding: 15px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; display: none; margin-top: 20px; border-left: 5px solid #007bff; font-size: 0.9rem; }
        .label { font-weight: bold; color: #333; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <div class='container'>
        <h2>📝 ブログ記事用HTML生成</h2>
        <span class='label'>記事タイトル</span>
        <input type='text' id='t' placeholder='例: 本日の製作記録'>
        <span class='label'>画像ファイル名 (posts/フォルダ内。空欄でもOK)</span>
        <input type='text' id='i' placeholder='例: screenshot.png'>
        <span class='label'>本文</span>
        <textarea id='c' rows='8' placeholder='内容を入力してください...'></textarea>
        <button onclick='gen()'>ブログ用HTMLを生成</button>
        <pre id='o'></pre>
    </div>
    <script>
        function gen(){
            const title = document.getElementById('t').value;
            const img_filename = document.getElementById('i').value; // 'i' for image_filename
            const content = document.getElementById('c').value;
            const date = new Date().toISOString().split('T')[0];

            let img_html = '';
            if (img_filename) {
                img_html = `<img src="posts/${img_filename}" >`;
            }

            const html_snippet = `\n        <article style='margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px;'>\n            <h2>${title}</h2>\n            <p style='color: #888; font-size: 0.9rem;'>公開日: ${date}</p>\n            ${img_html}\n            <div class='post-body'>${content.replace(/\n/g, '<br>')}</div>\n        </article>\n`;
            const output_element = document.getElementById('o');
            output_element.textContent = html_snippet;
            output_element.style.display = 'block';
        }
    </script>
</body>
</html>
